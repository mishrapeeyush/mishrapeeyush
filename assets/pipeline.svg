<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-label="Media flows. Ingest: upload, URL or YouTube goes to the media service, a job queue, a worker for OCR, speech and vision, embedding, then the vector store. Artifacts: plugin or agent files are deduplicated and classified, get thumbnails and context text, are embedded and linked to the chat. Answer: question, embed query, hybrid search, optional rerank, top-k chunks, LLM answer.">
<defs><style>text{font-family:SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.t{fill:#D7FFE0;font-size:13px;font-weight:700}.s{fill:#6FA17C;font-size:10.5px}.cap{fill:#6FA17C;font-size:12px}.lane{fill:#B8E6C4;font-size:12px;font-weight:700;letter-spacing:.06em}.pill{fill:#B8E6C4;font-size:12px}
.ln{fill:none;stroke:#1F6B36;stroke-width:2;stroke-dasharray:5 5;animation:dash 1s linear infinite}.rt{stroke:#4D8F1A}
@keyframes dash{to{stroke-dashoffset:-10}}
.nd{opacity:0;animation:in .6s ease-out forwards}@keyframes in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.nd{opacity:1}}
</style></defs>
<rect x="1" y="1" width="998" height="402" rx="16" fill="#020A04" stroke="#0B3D1A"/>
<text x="56" y="42" class="lane" fill="#00FF41" style="fill:#00FF41">INGEST: UPLOAD, URL OR YOUTUBE</text><g class="nd" style="animation-delay:0.00s"><rect x="56" y="52" width="128" height="60" rx="12" fill="#04140A" stroke="#00FF41" stroke-width="1.6"/><text x="120.0" y="80.0" text-anchor="middle" class="t">Upload / URL</text><text x="120.0" y="97.0" text-anchor="middle" class="s">file or YouTube</text></g><path d="M184 82 H210" class="ln"/><g class="nd" style="animation-delay:0.12s"><rect x="210" y="52" width="128" height="60" rx="12" fill="#04140A" stroke="#00FF41" stroke-width="1.6"/><text x="274.0" y="80.0" text-anchor="middle" class="t">Media service</text><text x="274.0" y="97.0" text-anchor="middle" class="s">validate · store</text></g><path d="M338 82 H364" class="ln"/><g class="nd" style="animation-delay:0.24s"><rect x="364" y="52" width="128" height="60" rx="12" fill="#04140A" stroke="#00FF41" stroke-width="1.6"/><text x="428.0" y="80.0" text-anchor="middle" class="t">Job queue</text><text x="428.0" y="97.0" text-anchor="middle" class="s">async stages</text></g><path d="M492 82 H518" class="ln"/><g class="nd" style="animation-delay:0.36s"><rect x="518" y="52" width="128" height="60" rx="12" fill="#04140A" stroke="#00FF41" stroke-width="1.6"/><text x="582.0" y="80.0" text-anchor="middle" class="t">Worker</text><text x="582.0" y="97.0" text-anchor="middle" class="s">OCR · ASR · vision</text></g><path d="M646 82 H672" class="ln"/><g class="nd" style="animation-delay:0.48s"><rect x="672" y="52" width="128" height="60" rx="12" fill="#04140A" stroke="#00FF41" stroke-width="1.6"/><text x="736.0" y="80.0" text-anchor="middle" class="t">Embed</text><text x="736.0" y="97.0" text-anchor="middle" class="s">dense + sparse</text></g><path d="M800 82 H826" class="ln"/><g class="nd" style="animation-delay:0.60s"><rect x="826" y="52" width="128" height="60" rx="12" fill="#04140A" stroke="#00FF41" stroke-width="1.6"/><text x="890.0" y="80.0" text-anchor="middle" class="t">Vector store</text><text x="890.0" y="97.0" text-anchor="middle" class="s">status event</text></g><text x="56" y="162" class="lane" fill="#00D9A0" style="fill:#00D9A0">ARTIFACTS: FILES FROM PLUGINS AND AGENTS</text><g class="nd" style="animation-delay:0.72s"><rect x="56" y="172" width="128" height="60" rx="12" fill="#04140A" stroke="#00D9A0" stroke-width="1.6"/><text x="120.0" y="200.0" text-anchor="middle" class="t">Plugin / agent</text><text x="120.0" y="217.0" text-anchor="middle" class="s">generated files</text></g><path d="M184 202 H210" class="ln"/><g class="nd" style="animation-delay:0.84s"><rect x="210" y="172" width="128" height="60" rx="12" fill="#04140A" stroke="#00D9A0" stroke-width="1.6"/><text x="274.0" y="200.0" text-anchor="middle" class="t">Media service</text><text x="274.0" y="217.0" text-anchor="middle" class="s">dedupe · classify</text></g><path d="M338 202 H364" class="ln"/><g class="nd" style="animation-delay:0.96s"><rect x="364" y="172" width="128" height="60" rx="12" fill="#04140A" stroke="#00D9A0" stroke-width="1.6"/><text x="428.0" y="200.0" text-anchor="middle" class="t">Thumbnails</text><text x="428.0" y="217.0" text-anchor="middle" class="s">parallel, optional</text></g><path d="M492 202 H518" class="ln"/><g class="nd" style="animation-delay:1.08s"><rect x="518" y="172" width="128" height="60" rx="12" fill="#04140A" stroke="#00D9A0" stroke-width="1.6"/><text x="582.0" y="200.0" text-anchor="middle" class="t">Context text</text><text x="582.0" y="217.0" text-anchor="middle" class="s">describe · tag</text></g><path d="M646 202 H672" class="ln"/><g class="nd" style="animation-delay:1.20s"><rect x="672" y="172" width="128" height="60" rx="12" fill="#04140A" stroke="#00D9A0" stroke-width="1.6"/><text x="736.0" y="200.0" text-anchor="middle" class="t">Embed + index</text><text x="736.0" y="217.0" text-anchor="middle" class="s">vector store</text></g><path d="M800 202 H826" class="ln"/><g class="nd" style="animation-delay:1.32s"><rect x="826" y="172" width="128" height="60" rx="12" fill="#04140A" stroke="#00D9A0" stroke-width="1.6"/><text x="890.0" y="200.0" text-anchor="middle" class="t">Link to chat</text><text x="890.0" y="217.0" text-anchor="middle" class="s">session media</text></g><text x="56" y="282" class="lane" fill="#B6FF3B" style="fill:#B6FF3B">ANSWER: RETRIEVAL AT QUESTION TIME</text><g class="nd" style="animation-delay:1.44s"><rect x="56" y="292" width="128" height="60" rx="12" fill="#04140A" stroke="#B6FF3B" stroke-width="1.6"/><text x="120.0" y="320.0" text-anchor="middle" class="t">Question</text><text x="120.0" y="337.0" text-anchor="middle" class="s">user query</text></g><path d="M184 322 H210" class="ln"/><g class="nd" style="animation-delay:1.56s"><rect x="210" y="292" width="128" height="60" rx="12" fill="#04140A" stroke="#B6FF3B" stroke-width="1.6"/><text x="274.0" y="320.0" text-anchor="middle" class="t">Embed query</text><text x="274.0" y="337.0" text-anchor="middle" class="s">same model</text></g><path d="M338 322 H364" class="ln"/><g class="nd" style="animation-delay:1.68s"><rect x="364" y="292" width="128" height="60" rx="12" fill="#04140A" stroke="#B6FF3B" stroke-width="1.6"/><text x="428.0" y="320.0" text-anchor="middle" class="t">Hybrid search</text><text x="428.0" y="337.0" text-anchor="middle" class="s">dense + BM25</text></g><path d="M492 322 H518" class="ln"/><g class="nd" style="animation-delay:1.80s"><rect x="518" y="292" width="128" height="60" rx="12" fill="#04140A" stroke="#B6FF3B" stroke-width="1.6"/><text x="582.0" y="320.0" text-anchor="middle" class="t">Rerank</text><text x="582.0" y="337.0" text-anchor="middle" class="s">optional, flagged</text></g><path d="M646 322 H672" class="ln"/><g class="nd" style="animation-delay:1.92s"><rect x="672" y="292" width="128" height="60" rx="12" fill="#04140A" stroke="#B6FF3B" stroke-width="1.6"/><text x="736.0" y="320.0" text-anchor="middle" class="t">Top-k chunks</text><text x="736.0" y="337.0" text-anchor="middle" class="s">with sources</text></g><path d="M800 322 H826" class="ln"/><g class="nd" style="animation-delay:2.04s"><rect x="826" y="292" width="128" height="60" rx="12" fill="#04140A" stroke="#B6FF3B" stroke-width="1.6"/><text x="890.0" y="320.0" text-anchor="middle" class="t">LLM answer</text><text x="890.0" y="337.0" text-anchor="middle" class="s">grounded</text></g><circle opacity="0" r="4.5" fill="#00FF41"><animateMotion dur="6.4s" begin="0.0s" repeatCount="indefinite" path="M184 82 H826"/><set attributeName="opacity" to="1" begin="0.0s"/></circle><circle opacity="0" r="4.5" fill="#00FF41"><animateMotion dur="6.4s" begin="3.2s" repeatCount="indefinite" path="M184 82 H826"/><set attributeName="opacity" to="1" begin="3.2s"/></circle><circle opacity="0" r="4.5" fill="#00D9A0"><animateMotion dur="6.4s" begin="0.8s" repeatCount="indefinite" path="M184 202 H826"/><set attributeName="opacity" to="1" begin="0.8s"/></circle><circle opacity="0" r="4.5" fill="#00D9A0"><animateMotion dur="6.4s" begin="4.0s" repeatCount="indefinite" path="M184 202 H826"/><set attributeName="opacity" to="1" begin="4.0s"/></circle><circle opacity="0" r="4.5" fill="#B6FF3B"><animateMotion dur="6.4s" begin="1.6s" repeatCount="indefinite" path="M184 322 H826"/><set attributeName="opacity" to="1" begin="1.6s"/></circle><circle opacity="0" r="4.5" fill="#B6FF3B"><animateMotion dur="6.4s" begin="4.8s" repeatCount="indefinite" path="M184 322 H826"/><set attributeName="opacity" to="1" begin="4.8s"/></circle>
<text x="500" y="384" text-anchor="middle" class="cap">bad answers usually start on the left of a lane: extraction, chunking, search. The model is rarely the weak link.</text>
</svg>