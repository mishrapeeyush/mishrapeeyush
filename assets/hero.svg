<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Terminal: Peeyush Mishra, backend engineer. Go, gRPC, job queues, hybrid search, LLM gateways. Building AI backends at OnDemand AI and SchoolHack AI.">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00ADD8"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF6AC1"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ADD8"/><stop offset="1" stop-color="#FF6AC1"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#30363d" opacity=".55"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<clipPath id="c0"><rect x="74" y="88" height="40" width="0" class="t t0"/></clipPath>
<style>.t0{animation:ty0 0.50s steps(6) 0.4s forwards}@keyframes ty0{to{width:78px}}</style>
<clipPath id="c1"><rect x="50" y="122" height="40" width="0" class="t t1"/></clipPath>
<style>.t1{animation:ty1 1.48s steps(33) 1.3s forwards}@keyframes ty1{to{width:477px}}</style>
<clipPath id="c2"><rect x="74" y="176" height="40" width="0" class="t t2"/></clipPath>
<style>.t2{animation:ty2 0.58s steps(13) 2.8s forwards}@keyframes ty2{to{width:159px}}</style>
<clipPath id="c3"><rect x="50" y="208" height="40" width="0" class="t t3"/></clipPath>
<style>.t3{animation:ty3 2.38s steps(53) 3.8s forwards}@keyframes ty3{to{width:623px}}</style>
<clipPath id="c4"><rect x="74" y="262" height="40" width="0" class="t t4"/></clipPath>
<style>.t4{animation:ty4 0.50s steps(3) 5.9s forwards}@keyframes ty4{to{width:43px}}</style>
<clipPath id="c5"><rect x="50" y="294" height="40" width="0" class="t t5"/></clipPath>
<style>.t5{animation:ty5 2.25s steps(50) 6.5s forwards}@keyframes ty5{to{width:588px}}</style>
<style>
text{font-family:SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:19px}
.p{fill:#00ADD8;font-weight:700} .cmd{fill:#e6edf3} .out{fill:#8b949e} .hl{fill:#fff;font-weight:700;font-size:23px}
.bar{fill:#7d8590;font-size:13px}
.cur{fill:#00ADD8;opacity:0;animation:show 0s 8.8s forwards,blink 1.1s steps(1) 8.8s infinite}
@keyframes show{to{opacity:1}} @keyframes blink{50%{opacity:0}}
.glow1{animation:f1 9s ease-in-out infinite alternate} .glow2{animation:f2 11s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(60px,30px)}} @keyframes f2{to{transform:translate(-70px,-20px)}}
.sweep{animation:sw 6s linear infinite} @keyframes sw{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .t{width:800px!important} .cur{opacity:1}}
</style>
<clipPath id="card"><rect x="2" y="2" width="896" height="376" rx="18"/></clipPath>
</defs>
<rect x="2" y="2" width="896" height="376" rx="18" fill="#0d1117"/>
<g clip-path="url(#card)">
<rect width="900" height="380" fill="url(#dots)"/>
<circle class="glow1" cx="170" cy="70" r="120" fill="#00ADD8" opacity=".28" filter="url(#blur)"/>
<circle class="glow2" cx="780" cy="320" r="130" fill="#FF6AC1" opacity=".25" filter="url(#blur)"/>
<rect x="0" y="0" width="900" height="44" fill="#161b22"/>
<rect class="sweep" x="0" y="42" width="200" height="2" fill="url(#hl)" opacity=".9"/>
<circle cx="26" cy="22" r="6.5" fill="#ff5f56"/><circle cx="48" cy="22" r="6.5" fill="#ffbd2e"/><circle cx="70" cy="22" r="6.5" fill="#27c93f"/>
<text x="450" y="27" text-anchor="middle" class="bar">peeyush@backend: ~</text>
<text x="52" y="116" class="p">❯</text><g clip-path="url(#c0)"><text x="76" y="116" class="cmd">whoami</text></g>
<g clip-path="url(#c1)"><text x="52" y="150" class="out hl">Peeyush Mishra · backend engineer</text></g>
<text x="52" y="204" class="p">❯</text><g clip-path="url(#c2)"><text x="76" y="204" class="cmd">cat stack.txt</text></g>
<g clip-path="url(#c3)"><text x="52" y="236" class="out">Go · gRPC · job queues · hybrid search · LLM gateways</text></g>
<text x="52" y="290" class="p">❯</text><g clip-path="url(#c4)"><text x="76" y="290" class="cmd">now</text></g>
<g clip-path="url(#c5)"><text x="52" y="322" class="out">building AI backends @ OnDemand AI + SchoolHack AI</text></g>
<rect x="638" y="304" width="11" height="24" class="cur" rx="2"/>
</g>
<rect x="2" y="2" width="896" height="376" rx="18" fill="none" stroke="url(#g)" stroke-width="2"/>
</svg>