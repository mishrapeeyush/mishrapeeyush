<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Platform map: apps and chat call an orchestrator, which routes work to an LLM gateway, a sandboxed agent runtime, media workers and storage access, backed by MongoDB, Redis queues and Qdrant.">
<defs><style>
text{font-family:SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.t{fill:#e6edf3;font-size:15px;font-weight:700} .s{fill:#8b949e;font-size:11px} .s2{fill:#c9d1d9;font-size:12.5px} .cap{fill:#8b949e;font-size:12px}
.ln{fill:none;stroke:#484f58;stroke-width:2;stroke-dasharray:5 5;animation:dash 1s linear infinite} @keyframes dash{to{stroke-dashoffset:-10}}
.nd{opacity:0;animation:in .6s ease-out forwards} @keyframes in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .nd{opacity:1}}
</style></defs>
<rect x="1" y="1" width="998" height="378" rx="16" fill="#0d1117" stroke="#30363d"/>
<path d="M530 156 C 615 156 615 54.0 700 54.0" class="ln"/><path d="M530 156 C 615 156 615 128.0 700 128.0" class="ln"/><path d="M530 156 C 615 156 615 202.0 700 202.0" class="ln"/><path d="M530 156 C 615 156 615 276.0 700 276.0" class="ln"/><path d="M200 156 H300" class="ln"/>
<g class="nd" style="animation-delay:0s"><rect x="30" y="118" width="170" height="76" rx="12" fill="#161b22" stroke="#e6edf3" stroke-width="1.6"/><text x="115.0" y="153.0" text-anchor="middle" class="t">Apps and chat</text><text x="115.0" y="171.0" text-anchor="middle" class="s">users, clients</text></g><g class="nd" style="animation-delay:0.4s"><rect x="300" y="118" width="230" height="76" rx="12" fill="#161b22" stroke="#00ADD8" stroke-width="1.6"/><text x="415.0" y="153.0" text-anchor="middle" class="t">Orchestrator</text><text x="415.0" y="171.0" text-anchor="middle" class="s">plans and routes steps</text></g><g class="nd" style="animation-delay:0.8s"><rect x="700" y="26" width="250" height="56" rx="12" fill="#161b22" stroke="#00ADD8" stroke-width="1.6"/><text x="825.0" y="51.0" text-anchor="middle" class="t">LLM gateway</text><text x="825.0" y="69.0" text-anchor="middle" class="s">many providers, embeddings</text></g><g class="nd" style="animation-delay:1.05s"><rect x="700" y="100" width="250" height="56" rx="12" fill="#161b22" stroke="#8B5CF6" stroke-width="1.6"/><text x="825.0" y="125.0" text-anchor="middle" class="t">Agent runtime</text><text x="825.0" y="143.0" text-anchor="middle" class="s">sandboxed, per session</text></g><g class="nd" style="animation-delay:1.3s"><rect x="700" y="174" width="250" height="56" rx="12" fill="#161b22" stroke="#FF6AC1" stroke-width="1.6"/><text x="825.0" y="199.0" text-anchor="middle" class="t">Media workers</text><text x="825.0" y="217.0" text-anchor="middle" class="s">OCR, ASR, embeddings</text></g><g class="nd" style="animation-delay:1.55s"><rect x="700" y="248" width="250" height="56" rx="12" fill="#161b22" stroke="#2EA043" stroke-width="1.6"/><text x="825.0" y="273.0" text-anchor="middle" class="t">Storage access</text><text x="825.0" y="291.0" text-anchor="middle" class="s">signed URLs</text></g>
<g class="nd" style="animation-delay:1.8s"><rect x="290" y="322" width="150" height="40" rx="20" fill="#0d1117" stroke="#47A248" stroke-opacity=".85"/><circle cx="310" cy="342" r="4" fill="#47A248"/><text x="324" y="347" class="s2">MongoDB</text></g><g class="nd" style="animation-delay:2.0s"><rect x="458" y="322" width="150" height="40" rx="20" fill="#0d1117" stroke="#DC382D" stroke-opacity=".85"/><circle cx="478" cy="342" r="4" fill="#DC382D"/><text x="492" y="347" class="s2">Redis queues</text></g><g class="nd" style="animation-delay:2.2s"><rect x="626" y="322" width="150" height="40" rx="20" fill="#0d1117" stroke="#DC244C" stroke-opacity=".85"/><circle cx="646" cy="342" r="4" fill="#DC244C"/><text x="660" y="347" class="s2">Qdrant</text></g>
<circle r="4" fill="#00ADD8"><animateMotion dur="2.60s" begin="0.0s" repeatCount="indefinite" path="M530 156 C 615 156 615 54.0 700 54.0"/></circle><circle r="4" fill="#8B5CF6"><animateMotion dur="2.75s" begin="0.4s" repeatCount="indefinite" path="M530 156 C 615 156 615 128.0 700 128.0"/></circle><circle r="4" fill="#FF6AC1"><animateMotion dur="2.90s" begin="0.8s" repeatCount="indefinite" path="M530 156 C 615 156 615 202.0 700 202.0"/></circle><circle r="4" fill="#2EA043"><animateMotion dur="3.05s" begin="1.2s" repeatCount="indefinite" path="M530 156 C 615 156 615 276.0 700 276.0"/></circle><circle r="4" fill="#e6edf3"><animateMotion dur="3.95s" begin="3.6s" repeatCount="indefinite" path="M200 156 H300"/></circle>
<text x="40" y="347" class="cap">data layer</text>
</svg>