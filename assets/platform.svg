<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="One chat message end to end: client, API with auth and moderation, job queue, planner, tools, with an LLM gateway and media service, and a stream relay sending events back to the client. Data layer: MongoDB, Redis and Qdrant.">
<defs><style>text{font-family:SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.t{fill:#e6edf3;font-size:14.5px;font-weight:700}.s{fill:#8b949e;font-size:10.5px}.cap{fill:#8b949e;font-size:12px}.lane{fill:#c9d1d9;font-size:12px;font-weight:700;letter-spacing:.06em}.pill{fill:#c9d1d9;font-size:12px}
.ln{fill:none;stroke:#484f58;stroke-width:2;stroke-dasharray:5 5;animation:dash 1s linear infinite}.rt{stroke:#7c3a63}
@keyframes dash{to{stroke-dashoffset:-10}}
.nd{opacity:0;animation:in .6s ease-out forwards}@keyframes in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.nd{opacity:1}}
</style></defs>
<rect x="1" y="1" width="998" height="370" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="30" class="lane">ONE CHAT MESSAGE, END TO END</text>
<text x="500" y="278" text-anchor="middle" class="cap">blue: the request  ·  pink: results streaming back to the user</text>
<path d="M160 82 H200" class="ln"/><path d="M390 82 H430" class="ln"/><path d="M620 82 H660" class="ln"/><path d="M810 82 H850" class="ln"/><path d="M735 114 V190" class="ln"/><path d="M915 114 V190" class="ln"/><path d="M560 220 H430" class="ln rt"/><path d="M200 220 H90 V114" class="ln rt"/><g class="nd" style="animation-delay:0.00s"><rect x="20" y="50" width="140" height="64" rx="12" fill="#161b22" stroke="#e6edf3" stroke-width="1.6"/><text x="90.0" y="80.0" text-anchor="middle" class="t">Client</text><text x="90.0" y="97.0" text-anchor="middle" class="s">app or chat</text></g><g class="nd" style="animation-delay:0.30s"><rect x="200" y="50" width="190" height="64" rx="12" fill="#161b22" stroke="#00ADD8" stroke-width="1.6"/><text x="295.0" y="80.0" text-anchor="middle" class="t">API</text><text x="295.0" y="97.0" text-anchor="middle" class="s">auth · limits · moderation</text></g><g class="nd" style="animation-delay:0.60s"><rect x="430" y="50" width="190" height="64" rx="12" fill="#161b22" stroke="#8B5CF6" stroke-width="1.6"/><text x="525.0" y="80.0" text-anchor="middle" class="t">Job queue</text><text x="525.0" y="97.0" text-anchor="middle" class="s">async · one run per session</text></g><g class="nd" style="animation-delay:0.90s"><rect x="660" y="50" width="150" height="64" rx="12" fill="#161b22" stroke="#FF6AC1" stroke-width="1.6"/><text x="735.0" y="80.0" text-anchor="middle" class="t">Planner</text><text x="735.0" y="97.0" text-anchor="middle" class="s">phases · steps · gate</text></g><g class="nd" style="animation-delay:1.20s"><rect x="850" y="50" width="130" height="64" rx="12" fill="#161b22" stroke="#2EA043" stroke-width="1.6"/><text x="915.0" y="80.0" text-anchor="middle" class="t">Tools</text><text x="915.0" y="97.0" text-anchor="middle" class="s">REST · MCP · agent</text></g><g class="nd" style="animation-delay:1.80s"><rect x="560" y="190" width="170" height="60" rx="12" fill="#161b22" stroke="#00ADD8" stroke-width="1.6"/><text x="645.0" y="218.0" text-anchor="middle" class="t">LLM gateway</text><text x="645.0" y="235.0" text-anchor="middle" class="s">chat · embeddings · OCR</text></g><g class="nd" style="animation-delay:2.00s"><rect x="790" y="190" width="190" height="60" rx="12" fill="#161b22" stroke="#FF6AC1" stroke-width="1.6"/><text x="885.0" y="218.0" text-anchor="middle" class="t">Media service</text><text x="885.0" y="235.0" text-anchor="middle" class="s">files · artifacts · search</text></g><g class="nd" style="animation-delay:2.20s"><rect x="200" y="190" width="230" height="60" rx="12" fill="#161b22" stroke="#8B5CF6" stroke-width="1.6"/><text x="315.0" y="218.0" text-anchor="middle" class="t">Stream relay</text><text x="315.0" y="235.0" text-anchor="middle" class="s">SSE · replay on reconnect</text></g><g class="nd" style="animation-delay:2.6s"><rect x="250" y="296" width="218" height="40" rx="20" fill="#0d1117" stroke="#47A248" stroke-opacity=".85"/><circle cx="270" cy="316" r="4" fill="#47A248"/><text x="284" y="321" class="pill">MongoDB <tspan fill="#8b949e">· sessions · runs</tspan></text></g><g class="nd" style="animation-delay:2.8000000000000003s"><rect x="480" y="296" width="218" height="40" rx="20" fill="#0d1117" stroke="#DC382D" stroke-opacity=".85"/><circle cx="500" cy="316" r="4" fill="#DC382D"/><text x="514" y="321" class="pill">Redis <tspan fill="#8b949e">· queues · pub/sub · replay</tspan></text></g><g class="nd" style="animation-delay:3.0s"><rect x="710" y="296" width="218" height="40" rx="20" fill="#0d1117" stroke="#DC244C" stroke-opacity=".85"/><circle cx="730" cy="316" r="4" fill="#DC244C"/><text x="744" y="321" class="pill">Qdrant <tspan fill="#8b949e">· vectors</tspan></text></g><circle r="4.5" fill="#00ADD8"><animateMotion dur="5s" repeatCount="indefinite" path="M160 82 H850"/></circle><circle r="4.5" fill="#00ADD8"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M160 82 H850"/></circle><circle r="4" fill="#FF6AC1"><animateMotion dur="3.2s" repeatCount="indefinite" path="M735 114 V190"/></circle><circle r="4" fill="#FF6AC1"><animateMotion dur="3.6s" begin="1s" repeatCount="indefinite" path="M915 114 V190"/></circle><circle r="4.5" fill="#FFB1E0"><animateMotion dur="4.2s" repeatCount="indefinite" path="M560 220 H430 M430 220 H200 M200 220 H90 V114"/></circle><circle r="4.5" fill="#FFB1E0"><animateMotion dur="4.2s" begin="2.1s" repeatCount="indefinite" path="M560 220 H430 M430 220 H200 M200 220 H90 V114"/></circle>
<text x="24" y="321" class="cap">data layer</text>
</svg>