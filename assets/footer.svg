<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Terminal: ./collaborate with Go, RAG and agent projects. Exit 0.">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FF41"/><stop offset=".55" stop-color="#00D9A0"/><stop offset="1" stop-color="#B6FF3B"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#0B3D1A" opacity=".8"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".28"/></pattern>
<clipPath id="a"><rect x="76" y="36" height="30" width="0" class="ta"/></clipPath>
<clipPath id="b"><rect x="50" y="68" height="30" width="0" class="tb"/></clipPath>
<clipPath id="card"><rect x="2" y="2" width="996" height="146" rx="16"/></clipPath>
<style>text{font-family:SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:19px}
.pr{fill:#00FF41;font-weight:700}.cmd{fill:#D7FFE0}.out{fill:#9ED8AE}.ok{fill:#B6FF3B}
.cur{fill:#00FF41;animation:bk 1.1s steps(1) infinite}@keyframes bk{50%{opacity:0}}
.ta{animation:ta 10s linear infinite}@keyframes ta{0%,4%{width:0;animation-timing-function:steps(30)}28%{width:380px}94%{width:380px}96%,100%{width:0}}
.tb{animation:tb 10s linear infinite}@keyframes tb{0%,32%{width:0;animation-timing-function:steps(48)}56%{width:590px}94%{width:590px}96%,100%{width:0}}
.ex{opacity:0;animation:ex 10s linear infinite}@keyframes ex{0%,60%{opacity:0}62%,94%{opacity:1}96%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ta{width:380px!important}.tb{width:590px!important}.ex{opacity:1!important}}</style>
</defs>
<rect x="2" y="2" width="996" height="146" rx="16" fill="#020A04"/>
<g clip-path="url(#card)"><rect width="1000" height="150" fill="url(#dots)"/>
<text x="50" y="58" class="pr">❯</text><g clip-path="url(#a)"><text x="76" y="58" class="cmd">./collaborate --go --rag --agents</text></g>
<g clip-path="url(#b)"><text x="50" y="92" class="out">open to Go, RAG and agentic AI projects. say hi.</text></g>
<g class="ex"><text x="50" y="128" class="ok">exit 0</text><rect x="126" y="112" width="11" height="20" rx="2" class="cur"/></g>
<rect width="1000" height="150" fill="url(#scan)"/></g>
<rect x="2" y="2" width="996" height="146" rx="16" fill="none" stroke="url(#g)" stroke-width="2"/>
</svg>
