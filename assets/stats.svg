<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 124" width="1000" height="124" role="img" aria-label="3.4 million plus active users, 165 million plus queries handled, 15 plus model providers, 9 media job types">
<defs><style>
text{font-family:SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.n{font-size:30px;font-weight:700} .l{font-size:12.5px;fill:#8b949e}
.tile{opacity:0;animation:up .7s ease-out forwards;transform-box:fill-box} @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.ring{animation:draw 1.6s cubic-bezier(.2,.7,.2,1) forwards} @keyframes draw{to{stroke-dashoffset:var(--to)}}
.dot{animation:pl 2.4s ease-in-out infinite} @keyframes pl{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .tile{opacity:1} .ring{stroke-dashoffset:var(--to)}}
</style></defs>
<g transform="translate(14,14)" class="tile" style="animation-delay:0.0s">
