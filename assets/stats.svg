<circle cx="48" cy="48" r="26" fill="none" stroke="#2EA043" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 48 48)" class="ring" style="--to:73.5;animation-delay:0.95s"/>
