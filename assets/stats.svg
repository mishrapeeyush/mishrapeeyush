<circle cx="48" cy="48" r="5" fill="#8B5CF6" class="dot" style="animation-delay:0.25s"/>
<text x="92" y="52" class="n" fill="#8B5CF6">165M+</text>
<text x="92" y="74" class="l">queries handled</text></g><g transform="translate(506,14)" class="tile" style="animation-delay:0.5s">
